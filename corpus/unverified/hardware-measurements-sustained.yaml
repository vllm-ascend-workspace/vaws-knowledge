  measurement:
    summary: A single-card Ascend910B4 sustains 0.95 of its fp16 and bf16 dense matmul peak and 0.65 of
      its int8 quantized matmul peak
    subject:
      id: Ascend910B4
      aliases:
      - 910B4
      - Ascend910B4-32G
      - A2-32G
      - Atlas A2 32G
      family: Atlas A2
    method:
      type: microbenchmark
      description: Single-card 910B4, NPU index 4, torch_npu 2.10.0. A 8192x8192x8192 dense matmul timed
        with torch.npu.Event. The int8 case uses torch_npu.npu_quant_matmul; plain torch.mm does not accept
        int8 on this stack. The sustained fraction is the observed throughput divided by the CANN platform_config
        theoretical peak for the same precision.
      parameters:
      - name: matmul_shape_m_n_k
        value: 8192x8192x8192
      - name: device_index
        value: '4'
      - name: cards
        value: '1'
      - name: timing
        value: torch.npu.Event
      - name: int8_operator
        value: torch_npu.npu_quant_matmul
      - name: memory_gib
        value: '32'
      source:
        kind: run_manifest
        ref: ascend-microbenchmark-npu4-2026-06-03
        note: Run manifest id as recorded by the contributing workspace, with the internal machine slot
          removed under redaction profile r2. The manifest itself is not public; the method description
          is what makes the number reproducible here.
    quantities:
    - name: fp16_dense_matmul_sustained
      basis: measured
      value: '232.332682'
      unit: tflops
      qualifier: 8192x8192x8192 dense matmul, single card
    - name: bf16_dense_matmul_sustained
      basis: measured
      value: '231.833233'
      unit: tflops
      qualifier: 8192x8192x8192 dense matmul, single card
    - name: int8_quant_matmul_sustained
      basis: measured
      value: '319.337134'
      unit: tops
      qualifier: 8192x8192x8192 dense matmul, single card
    - name: fp16_dense_matmul_sustained_fraction
      basis: sustained
      value: '0.95'
      unit: ratio
      qualifier: observed throughput divided by the CANN platform_config theoretical peak for the same
        precision
    - name: bf16_dense_matmul_sustained_fraction
      basis: sustained
      value: '0.95'
      unit: ratio
      qualifier: observed throughput divided by the CANN platform_config theoretical peak for the same
        precision
    - name: int8_quant_matmul_sustained_fraction
      basis: sustained
      value: '0.65'
      unit: ratio
      qualifier: observed throughput divided by the CANN platform_config theoretical peak for the same
        precision
    notes:
    - MFU denominator should still use theoretical peak for industry-comparable MFU.
    - Sustained peak is intended for operator roofline expectation and reclaim ranking.
    - INT8 uses torch_npu.npu_quant_matmul, not torch.mm; ordinary torch.mm does not support int8 on this
      stack.
    - The CANN version, driver, Python ABI and torch version of the measuring stack were not recorded,
      so those dimensions are bounded on neither side rather than guessed. A sustained fraction plausibly
      moves with all four, so re-measuring on a recorded stack is what would let this be promoted.
