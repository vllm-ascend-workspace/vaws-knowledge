    summary: MCP stdio transport uses newline-delimited JSON-RPC messages
    text: >
      The Model Context Protocol stdio transport encodes JSON-RPC messages as
      UTF-8 and delimits them with newlines. Messages must not contain embedded
      newlines. This is the client-visible stdio contract; it is not a claim
      about a local hardware or runtime measurement.
