  lifecycle:
    first_seen: '2026-09-08'
    updated_at: '2026-09-08'
    superseded_by: null
    resolved_by: null
  measurement:
    summary: Ascend031 declares 9 platform constants in CANN 9.0.0 platform_config, including its theoretical
      dense matmul peaks
    subject:
      id: Ascend031
      core_version: AIC-T-300
      compiler_target: dav-t300
    method:
      type: vendor_platform_config
      description: Read out of the CANN 9.0.0 platform_config file for Ascend031, which lives under the
        CANN install root at aarch64-linux/data/platform_config/. Peaks are the values CANN itself declares
        or that follow from the declared cube shape and clock; no operator was executed. Reproduce by
        parsing the same .ini from any CANN 9.0.0 installation.
      parameters:
      - name: cube_shape_m_n_k
        value: 16x16x16
      - name: npu_arch
        value: '3004'
      source:
        kind: vendor_file
        ref: cann-9.0.0:platform_config:Ascend031.ini
        note: 'CANN 9.0.0 aarch64-linux platform_config snapshot, taken 2026-06-02. The install prefix
          is left out of the reference on purpose: it is derivable from the release and adds nothing to
          followability, while the redaction ruleset reports a long mixed-case path as a possible credential.
          The machine the snapshot was taken on is not recorded either, and is not part of the claim:
          every CANN 9.0.0 installation ships this same file.'
    quantities:
    - name: fp16_dense_matmul_peak
      basis: theoretical
      value: '2.70336'
      unit: tflops
      qualifier: cube dense matmul, from declared cube shape and clock
    - name: int8_dense_matmul_peak
      basis: theoretical
      value: '5.40672'
      unit: tops
      qualifier: cube dense matmul, from declared cube shape and clock
    - name: int4_dense_matmul_peak
      basis: theoretical
      value: '10.81344'
      unit: tops
      qualifier: cube dense matmul, from declared cube shape and clock
    - name: memory_bandwidth_peak
      basis: theoretical
      value: '5.61'
      unit: gbps
      qualifier: derived from the declared DDR rate in bytes per cycle
    - name: cube_clock
      basis: declared
      value: '330'
      unit: mhz
    - name: ai_core_count
      basis: declared
      value: '1'
      unit: count
    - name: cube_core_count
      basis: declared
      value: '1'
      unit: count
    - name: vector_core_count
      basis: declared
      value: '1'
      unit: count
    - name: memory_rate
      basis: declared
      value: '17'
      unit: bytes_per_cycle
    notes:
    - A runtime scan of the local CANN installation is preferable to this snapshot. It exists so that
      an analysis host without CANN can still resolve a peak instead of guessing one.
    - These are theoretical peaks and are the correct MFU denominator. They are not what an operator achieves;
      a sustained fraction is a separate claim with basis=sustained.
