    summary: KirinX90 declares 4 platform constants in CANN 9.0.0 platform_config, including its theoretical
      dense matmul peaks
    subject:
      id: KirinX90
      core_version: AIC-L-300
      compiler_target: dav-l300
    method:
      type: vendor_platform_config
      description: Read out of the CANN 9.0.0 platform_config file for KirinX90, which lives under the
        CANN install root at aarch64-linux/data/platform_config/. Peaks are the values CANN itself declares
        or that follow from the declared cube shape and clock; no operator was executed. Reproduce by
        parsing the same .ini from any CANN 9.0.0 installation.
      parameters:
      - name: cube_shape_m_n_k
        value: 16x8x16
      - name: npu_arch
        value: '3003'
      source:
        kind: vendor_file
        ref: cann-9.0.0:platform_config:KirinX90.ini
        note: 'CANN 9.0.0 aarch64-linux platform_config snapshot, taken 2026-06-02. The install prefix
          is left out of the reference on purpose: it is derivable from the release and adds nothing to
          followability, while the redaction ruleset reports a long mixed-case path as a possible credential.
          The machine the snapshot was taken on is not recorded either, and is not part of the claim:
          every CANN 9.0.0 installation ships this same file.'
    quantities:
    - name: cube_clock
      basis: declared
      value: '0'
      unit: mhz
    - name: ai_core_count
      basis: declared
      value: '1'
      unit: count
    - name: cube_core_count
      basis: declared
      value: '1'
      unit: count
    - name: vector_core_count
      basis: declared
      value: '1'
      unit: count
    notes:
    - A runtime scan of the local CANN installation is preferable to this snapshot. It exists so that
      an analysis host without CANN can still resolve a peak instead of guessing one.
    - These are theoretical peaks and are the correct MFU denominator. They are not what an operator achieves;
      a sustained fraction is a separate claim with basis=sustained.
