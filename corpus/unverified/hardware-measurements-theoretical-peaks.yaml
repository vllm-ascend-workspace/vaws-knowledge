      value: '52.4288'
      unit: tflops
      qualifier: cube dense matmul, from declared cube shape and clock
    - name: int8_dense_matmul_peak
      basis: theoretical
      value: '104.8576'
      unit: tops
      qualifier: cube dense matmul, from declared cube shape and clock
    - name: int4_dense_matmul_peak
      basis: theoretical
      value: '209.7152'
      unit: tops
      qualifier: cube dense matmul, from declared cube shape and clock
    - name: memory_bandwidth_peak
      basis: theoretical
      value: '108.8'
      unit: gbps
      qualifier: derived from the declared DDR rate in bytes per cycle
    - name: memory_size
      basis: declared
      value: '22.352'
      unit: gib
    - name: cube_clock
      basis: declared
      value: '800'
      unit: mhz
    - name: ai_core_count
      basis: declared
      value: '8'
      unit: count
    - name: cube_core_count
      basis: declared
      value: '8'
      unit: count
    - name: vector_core_count
      basis: declared
      value: '7'
      unit: count
    - name: memory_rate
      basis: declared
      value: '17'
      unit: bytes_per_cycle
    notes:
    - A runtime scan of the local CANN installation is preferable to this snapshot. It exists so that
      an analysis host without CANN can still resolve a peak instead of guessing one.
    - These are theoretical peaks and are the correct MFU denominator. They are not what an operator achieves;
      a sustained fraction is a separate claim with basis=sustained.
