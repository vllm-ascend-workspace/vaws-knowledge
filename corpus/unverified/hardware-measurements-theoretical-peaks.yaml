# Vendor-declared platform constants, read out of the CANN 9.0.0
# platform_config snapshot. One entry per SoC; every quantity that SoC's
# file states travels together, because they were established by one read
# of one file and a conflict about any of them is a conflict about that
# read. Nobody other than the submitter has confirmed the snapshot, so
# these are unverified by definition (docs/review-pipeline.md).
schema_version: 2
kind: hardware-measurements
layer: unverified
updated_at: '2026-09-08'
entries:
- uuid: 8fb87494-54fb-46f1-a8e4-b7aee26e6d07
  slug: ascend031-cann-9.0.0-platform-config-peaks
  content_hash: sha256:5dae1e8f1af9e6a42da1c37ce6312c1fd3867062bd2764d83cfd6ecfb5383eef
  status: unverified
  confidence: low
  scope:
    soc:
      values:
      - Ascend031
    cann:
      values:
      - 9.0.0
    driver:
      any: true
      basis: The quantity is read from a CANN platform_config .ini file on disk. No device is opened and
        no driver call is made, so the driver revision cannot change what the file declares.
    python_abi:
      any: true
      basis: A vendor constant parsed out of a text file; no compiled extension participates, so the Python
        ABI cannot affect it.
    torch:
      any: true
      basis: The declaration is made by CANN, not by a framework. torch is not installed on the path that
        produced this number.
    torch_npu:
      any: true
      basis: The declaration is made by CANN, not by the torch_npu plugin, which is not involved in reading
        platform_config.
    vllm:
      any: true
      basis: A hardware capability declared by the vendor toolkit; no vLLM code runs to establish it.
    vllm_ascend:
      any: true
      basis: A hardware capability declared by the vendor toolkit; no plugin code runs to establish it.
    model:
      any: true
      basis: A peak throughput of the silicon. No weights are loaded and no model is executed.
    topology:
      any: true
      basis: A per-device declaration. It is the capability of one SoC and says nothing about, and is
        unaffected by, how many are used together.
    execution_mode:
      any: true
      basis: Nothing is executed. Graph capture and eager dispatch are alike irrelevant to what a configuration
        file states.
    component:
      any: true
      basis: A hardware capability constant. No software subsystem owns it; whichever consumer reads it
        gets the same number.
