    summary: Ascend310P5 declares 10 platform constants in CANN 9.0.0 platform_config, including its theoretical
      dense matmul peaks
    subject:
      id: Ascend310P5
      aliases:
      - Ascend310P
      core_version: AIC-M-200
      compiler_target: dav-m200
      family: Ascend310P
    method:
      type: vendor_platform_config
      description: Read out of the CANN 9.0.0 platform_config file for Ascend310P5, which lives under
        the CANN install root at aarch64-linux/data/platform_config/. Peaks are the values CANN itself
        declares or that follow from the declared cube shape and clock; no operator was executed. Reproduce
        by parsing the same .ini from any CANN 9.0.0 installation.
      parameters:
      - name: cube_shape_m_n_k
        value: 16x16x16
      - name: npu_arch
        value: '2002'
      source:
        kind: vendor_file
        ref: cann-9.0.0:platform_config:Ascend310P5.ini
        note: 'CANN 9.0.0 aarch64-linux platform_config snapshot, taken 2026-06-02. The install prefix
          is left out of the reference on purpose: it is derivable from the release and adds nothing to
          followability, while the redaction ruleset reports a long mixed-case path as a possible credential.
          The machine the snapshot was taken on is not recorded either, and is not part of the claim:
          every CANN 9.0.0 installation ships this same file.'
