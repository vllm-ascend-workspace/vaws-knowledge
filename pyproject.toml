[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaws-knowledge"
version = "0.2.0"
description = "Federated knowledge: verified runtime facts plus sourced reference material"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "vLLM Ascend contributors" },
]
dependencies = [
  "jsonschema>=4.21",
  "packaging>=23.0",
  "PyYAML>=6.0",
]

[project.scripts]
vaws-knowledge = "vaws_knowledge.cli:main"

[project.urls]
Homepage = "https://github.com/vllm-ascend-workspace/vaws-knowledge"
Repository = "https://github.com/vllm-ascend-workspace/vaws-knowledge"

[tool.hatch.build.targets.wheel]
packages = ["vaws_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "vaws_knowledge/data/corpus"
