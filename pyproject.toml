[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaws-knowledge"
version = "0.5.1"
description = "Local Markdown knowledge indexed through OpenViking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "vLLM Ascend contributors" },
]
dependencies = [
  "PyYAML>=6.0",
  "openviking==0.4.19",
  "openviking-sdk==0.1.10",
  "fastembed==0.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vaws-knowledge = "vaws_knowledge.cli:main"

[project.urls]
Homepage = "https://github.com/vllm-ascend-workspace/vaws-knowledge"
Repository = "https://github.com/vllm-ascend-workspace/vaws-knowledge"

[tool.hatch.build.targets.wheel]
packages = ["vaws_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "vaws_knowledge/data/corpus"
