# SYNTHETIC BAD VALUES - THIS FILE EXISTS TO BE REJECTED.
#
# Every address, hostname, path, e-mail and credential-shaped string in
# conformance/gate_vectors/ is invented for the purpose of being refused by a
# conforming gate. None of it came from a real machine, a real account or a
# real deployment. The addresses are RFC 5737 documentation ranges, the
# hostnames end in .invalid (RFC 2606), and the credentials are the string
# EXAMPLE repeated. A bulk redaction scan of this repository should treat this
# directory as expected-fail fixtures, not as a leak.
#
# Exporting the same unchanged measurement entry twice must produce the same
# bytes. This is the same property as export-idempotent-unchanged-entry, on the
# body that did not exist when that vector was written.
#
# The specific hazard is the numeric one. A measurement value is stored as the
# string "2.70336" precisely so that content_hash is byte-reproducible across
# languages; an exporter that parses it to a float and re-renders it may emit
# 2.7033600000000002, which changes the bytes, changes the hash, and
# manufactures a revision out of a round trip.
#
id: export-idempotent-measurement-entry
gate: export
expected_verdict: byte-identical
title: Two exports of one measurement entry are byte-identical
spec: docs/federation.md - Idempotency
runs: 2
notes: The rule-bodied idempotence vectors cannot catch an exporter that re-serializes a measurement value
  as a float, orders the quantity list by dict insertion, or stamps the method description. The new body
  needs its own vector for the same reason the old one has two.
