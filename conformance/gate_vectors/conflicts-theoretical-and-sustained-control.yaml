# SYNTHETIC BAD VALUES - THIS FILE EXISTS TO BE REJECTED.
#
# Every address, hostname, path, e-mail and credential-shaped string in
# conformance/gate_vectors/ is invented for the purpose of being refused by a
# conforming gate. None of it came from a real machine, a real account or a
# real deployment. The addresses are RFC 5737 documentation ranges, the
# hostnames end in .invalid (RFC 2606), and the credentials are the string
# EXAMPLE repeated. A bulk redaction scan of this repository should treat this
# directory as expected-fail fixtures, not as a leak.
#
# Control case: two measurements that must NOT be reported as a
# conflict.
#
id: conflicts-theoretical-and-sustained-control
gate: conflicts
expected_verdict: accept
title: A theoretical peak and a sustained fraction of it are not a conflict
spec: schemas/knowledge-v2.schema.json - measurement_quantity.basis
notes: 'The control that pins `basis` into the quantity identity. Both entries are about Ascend000, both name the
  quantity fp16_dense_matmul_peak, their coordinates overlap, and their values are 2.70336 and 0.95 - so a gate
  that keys conflicts on the quantity *name* alone reports a contradiction here, and would keep reporting one for
  as long as both facts remain true. They are different claims about the same physical thing: one is what the vendor
  declares, the other is the fraction of it an operator reaches. Both must be able to live in the corpus at the
  same coordinate at the same time.

  The units differ too (tflops against ratio), which is deliberate: a gate must not read a unit difference as a
  contradiction when the quantity identity already differs.'
