# SYNTHETIC BAD VALUES - THIS FILE EXISTS TO BE REJECTED.
#
# Every address, hostname, path, e-mail and credential-shaped string in
# conformance/gate_vectors/ is invented for the purpose of being refused by a
# conforming gate. None of it came from a real machine, a real account or a
# real deployment. The addresses are RFC 5737 documentation ranges, the
# hostnames end in .invalid (RFC 2606), and the credentials are the string
# EXAMPLE repeated. A bulk redaction scan of this repository should treat this
# directory as expected-fail fixtures, not as a leak.
#
# Two measurements of one quantity that disagree.
#
id: conflicts-measurement-contradicting-value
gate: conflicts
expected_verdict: reject
title: Two different values for one quantity at one coordinate are a conflict
spec: README.md - Conflict resolution; docs/review-pipeline.md - Coordinate conflicts
contradiction:
  rule: same subject, same quantity identity, overlapping coordinate, different value
  subject: Ascend000
  quantity: fp16_dense_matmul_peak
  basis: theoretical
  values:
  - '2.70336'
  - '2.5'
  location: document.entries[*].measurement.quantities[0].value
notes: 'This is the vector that keeps measurement dedup honest. The two entries are word-for-word identical apart
  from one number, so a gate that compares prose sees a duplicate and a gate that compares subject+quantity+coordinate
  sees a contradiction. Only the second is correct: collapsing them would silently drop one of two irreconcilable
  numbers, and a consumer would then compute a roofline against whichever survived.

  It is also why the gate must not stop at ''same claim, different wording''. Every quantity name, basis, unit and
  qualifier here agrees. The coordinates overlap on every dimension. There is nothing left to distinguish the two
  claims except the value, which means either one report is wrong or the coordinate does not model whatever separates
  them - and both of those are human decisions, which is why the gate reports and blocks rather than choosing.'
