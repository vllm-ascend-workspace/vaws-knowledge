# SYNTHETIC BAD VALUES - THIS FILE EXISTS TO BE REJECTED.
#
# Every address, hostname, path, e-mail and credential-shaped string in
# conformance/gate_vectors/ is invented for the purpose of being refused by a
# conforming gate. None of it came from a real machine, a real account or a
# real deployment. The addresses are RFC 5737 documentation ranges, the
# hostnames end in .invalid (RFC 2606), and the credentials are the string
# EXAMPLE repeated. A bulk redaction scan of this repository should treat this
# directory as expected-fail fixtures, not as a leak.
#
# A measured quantity with a value and no unit.
#
id: schema-measurement-quantity-without-unit
gate: schema
expected_verdict: reject
title: A claimed quantity with no unit must be refused
spec: schemas/knowledge-v2.schema.json - measurement_quantity requires name, basis, value, unit
violation:
  rule: a measurement quantity requires a unit
  location: document.entries[0].measurement.quantities[0]
notes: '2.70336 is not a fact. A number without its unit is the one defect in this class that cannot be caught later
  by review: TFLOPS and TOPS differ by a factor nobody can recover from the corpus, and a consumer that computes
  an MFU from a unitless value gets a plausible wrong answer rather than an error. The value and its unit are required
  together for that reason, and the entry''s own content_hash is recomputed over the broken body so that the *only*
  defect the vector carries is the missing unit.'
