# Canonicalization vector: the measurement body under key-order and
# whitespace variation.
#
id: measurement-key-order-and-whitespace
title: Key order and outer whitespace do not change a measurement hash
spec: docs/federation.md - Canonicalization, steps 3 and 4
invariance_group: measurement-body
notes: The same claim as measurement-body-payload-key, written with every mapping's keys in a different order, with
  CRLF inside the method description and with outer whitespace around two strings. Steps 3 and 4 exist so that a
  YAML round trip through another tool cannot manufacture a revision; if this vector's hash ever differs from its
  group partner's, an implementation is either reflowing prose or trusting mapping order.
