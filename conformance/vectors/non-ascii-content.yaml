# Conformance vector: non-ASCII content is serialized as itself.
#
# Step 4 specifies ensure_ascii=False and the (",", ":") separators. A naive
# json.dumps(payload, sort_keys=True) gets both wrong at once: it escapes every
# non-ASCII character to \uXXXX and it inserts ", " and ": " padding. Either
# mistake changes the hash of every entry, so this vector fails loudly for the
# most common shortcut.
#
# The characters are chosen so that this vector tests serialization only, and
# not anything the spec left open:
#
#   * all of them are identical in NFC and NFD, so the vector does not depend
#     on a Unicode normalization form the spec never mentions;
#   * the CJK and Cyrillic text has no case, so lower() and casefold() agree;
#   * exactly one non-ASCII fingerprint is present, so the sort order is the
#     same under a code-point sort and under a collation-aware sort.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: non-ascii-content
title: Non-ASCII strings are serialized unescaped, with compact separators
spec: docs/federation.md - canonicalization step 4
tests:
- ensure_ascii=False (no \uXXXX escaping)
- separators are (",", ":") with no padding
- non-ASCII in rule prose
- non-ASCII in a scope basis and in a values item
- non-ASCII fingerprint, with ASCII case folded in the same list
- UTF-8 is the hashed encoding
