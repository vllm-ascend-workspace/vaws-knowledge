# Conformance vector: non-ASCII spaces are content.
#
# docs/federation.md defines whitespace as exactly U+0009, U+000A,
# U+000B, U+000C, U+000D, U+0020. A non-breaking space (U+00A0) or an
# ideographic space (U+3000) is therefore part of the claim, including
# at the edges of a string and inside a fingerprint. An implementation
# that uses Python's str.strip() or Unicode-aware whitespace classes
# consumes those characters and diverges.
#
# ASCII whitespace and case on the same fingerprint list still collapse
# (step 2). The two classes are not interchangeable.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: non-ascii-whitespace-preserved
title: NBSP and U+3000 are preserved; ASCII whitespace still collapses
spec: docs/federation.md - canonicalization steps 2 and 3 (ASCII whitespace)
tests:
- leading and trailing NBSP on rule prose are preserved
- leading and trailing U+3000 on rule prose are preserved
- NBSP inside a fingerprint is not collapsed
- U+3000 inside a fingerprint is not collapsed
- ASCII-only fingerprints on the same list still collapse and lowercase
