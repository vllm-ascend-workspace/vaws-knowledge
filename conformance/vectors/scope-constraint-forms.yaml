# Conformance vector: all three constraint forms, and list order in scope.
#
# The schema allows a dimension to be bounded by `values`, bounded by `range`
# (with null for an unbounded side), or claimed independent with `any` +
# `basis`. All three appear below, including both a fully bounded range and a
# half-open one.
#
# The load-bearing part is `topology.values`, written out of alphabetical order
# on purpose. federation.md sorts exactly two things: fingerprints (step 2) and
# mapping keys (step 4, sort_keys=True). It does not sort other arrays, so the
# order an author wrote their `values` in is part of the payload and an
# implementation that helpfully sorts every list diverges here.
#
# That is a pinned reading of silence rather than of prose, and it is listed in
# conformance/README.md with the rest.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: scope-constraint-forms
title: values, range and any in one scope, with values order preserved
spec: docs/federation.md - canonicalization steps 3 and 4; schemas/knowledge-v2.schema.json constraint
tests:
- values constraints
- fully bounded range constraints
- half-open range constraints, with null preserved as null
- any + basis constraints
- non-fingerprint array order is preserved, not sorted
- null is serialized as JSON null, not as a string
