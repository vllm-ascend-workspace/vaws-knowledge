# Conformance vector: a fingerprint list that normalizes to nothing.
#
# Every item is empty or whitespace-only, so step 2 drops all of them. The
# question the spec does not answer is what happens to the key: step 2 says to
# drop empties, and says nothing about dropping the now-empty list.
#
# This vector pins the literal reading - the key stays, with an empty array -
# because the alternative (silently removing the key) would make an entry with
# no usable fingerprints hash like an entry that never had the key at all, and
# those are different claims. The choice is listed in conformance/README.md
# under the ambiguities, so a fork that reads it the other way fails here
# loudly and can argue the point in an issue.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: fingerprints-all-empty
title: A fingerprint list emptied by normalization stays present as an empty array
spec: docs/federation.md - canonicalization step 2 (pinned reading)
tests:
- all-empty fingerprint lists normalize to []
- the fingerprints key is not removed by normalization
