# Conformance vector: CRLF line endings normalize to LF.
#
# An entry authored on Windows, or round-tripped through a tool that writes
# CRLF, must hash identically to the same entry with LF. Without step 3 the
# same claim gets a second revision purely from a checkout setting.
#
# The CRs are written as \r escapes in double-quoted YAML rather than as literal
# CR bytes on purpose: a literal CR in a tracked file is exactly what git
# autocrlf, editors and review tooling rewrite, which would quietly turn this
# vector into a copy of a plain LF vector.
#
# Every line here has non-whitespace at both ends, so this vector does not
# depend on whether an implementation also strips per-line trailing whitespace -
# the spec does not say, and the kit does not pin it.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: line-endings-crlf
title: CRLF inside a multi-line string normalizes to LF
spec: docs/federation.md - canonicalization step 3
tests:
- CRLF inside rule prose becomes LF
- CRLF inside a scope basis becomes LF
- a trailing CRLF is removed by the outer strip
- blank lines inside prose are preserved as LF
