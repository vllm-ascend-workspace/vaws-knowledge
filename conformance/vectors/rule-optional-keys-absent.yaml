# Conformance vector: absent optional keys stay absent.
#
# `rule.avoidance` and `rule.fingerprints` are optional. This entry omits both,
# and the expected payload omits both too: nothing is defaulted in. An
# implementation that fills missing optionals with "" or [] before hashing -
# a very natural thing for a dataclass or a struct with zero values to do -
# produces a different hash for the same entry, and every such entry gets a
# revision the first time it passes through that implementation.
#
# Pair this with fingerprints-all-empty: `fingerprints: []` and no
# `fingerprints` key are two different payloads, and both are legal entries.
#
# Synthetic fixture content. Not knowledge. Do not cite.
