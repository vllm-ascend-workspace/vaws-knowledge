  rule:
    avoidance: Do not start by tuning gloo or HCCL interface environment variables. Check hostname resolution
      first; in this container family it is the root cause and the environment variables are a distraction.
    fingerprints:
    - gloo makedeviceforhostname
    - name or service not known hostname
    - torch.distributed gloo init failed container
    resolution: Map the container hostname to a loopback address in /etc/hosts before starting the service,
      and enforce it in container bootstrap so every new container is correct on first launch.
    root_cause: Fresh containers do not map their own hostname in /etc/hosts. The gloo store resolves
      the local hostname at init and fails when it does not resolve to an address.
    summary: Distributed init fails because the container does not resolve its own hostname
    symptom: The service crashes or hangs during torch.distributed init with gloo errors naming the container
      hostname, even for single-node tensor parallel above one rank.
  scope:
    cann:
      any: true
      basis: Resolution happens in the gloo store before CANN is initialised, so no CANN code path is
        involved.
    component:
      values:
      - service-bootstrap
    driver:
      any: true
      basis: No driver interaction occurs on this path; the process fails before device open.
    execution_mode:
      any: true
      basis: Failure precedes graph capture and eager execution alike.
    model:
      any: true
      basis: Occurs during distributed init, before any weights are read.
    python_abi:
      any: true
      basis: The defect is in container /etc/hosts content, not in any compiled extension.
    soc:
      any: true
      basis: The failure is in hostname resolution inside the container image, which happens before any
        device is opened; reproduced on two SoC generations.
    topology:
      values:
      - tp2
      - tp4
      - tp8
      - tp16
    torch:
      range:
        max: null
        min: 2.5.0
    torch_npu:
      any: true
      basis: The failing call is torch.distributed gloo hostname resolution, which torch_npu does not
        override.
    vllm:
      range:
        max: null
        min: 0.9.0
    vllm_ascend:
      any: true
      basis: Triggered by the container image, not by plugin code; observed across several plugin revisions.
