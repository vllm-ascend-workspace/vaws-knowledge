# Conformance vector: fingerprint lowercasing is ASCII-only.
#
# docs/federation.md step 2 lowercases A-Z only. Full Unicode
# lowercasing is not length-preserving: Python renders İ (U+0130) as
# i plus a combining dot, and would also fold É and Σ. Those letters
# must survive as themselves, while ABC still becomes abc.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: ascii-lowercase-preserves-nonascii
title: Fingerprint lowercasing is ASCII-only; İ É Σ are preserved
spec: docs/federation.md - canonicalization step 2 (ASCII-only lowercase)
tests:
- ASCII letters in a fingerprint are lowercased
- U+0130 LATIN CAPITAL LETTER I WITH DOT ABOVE is not lowercased
- U+00C9 LATIN CAPITAL LETTER E WITH ACUTE is not lowercased
- U+03A3 GREEK CAPITAL LETTER SIGMA is not lowercased
