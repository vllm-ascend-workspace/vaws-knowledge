# Conformance vector: fingerprint normalization.
#
# federation.md step 2 is six operations in one sentence - lowercase, strip,
# collapse internal runs, drop duplicates, drop empties, sort - and the order
# matters: three of the inputs below are the same fingerprint and only collide
# after case folding and whitespace collapsing. An implementation that
# de-duplicates before normalizing keeps all three and diverges.
#
# The input list is also deliberately out of order, and contains an empty
# string and a whitespace-only string.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: fingerprints-normalization
title: Fingerprints are lowercased, stripped, collapsed, de-duplicated and sorted
spec: docs/federation.md - canonicalization step 2
tests:
- case folding of fingerprints
- surrounding whitespace stripped
- internal whitespace runs collapsed to one space, including tabs
- duplicates that only collide after normalization are dropped
- empty and whitespace-only items are dropped
- output is sorted, regardless of input order
notes: >-
  Uses ASCII whitespace and ASCII case only. Non-ASCII spaces, ASCII-only
  lowercase of İ/É/Σ, and byte-wise fingerprint sort are pinned by dedicated
  vectors rather than by this one.
