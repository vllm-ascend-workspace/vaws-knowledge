# Conformance vector: strip the edges, reflow nothing.
#
# Step 3 is two operations and one prohibition. Every string in the payload -
# not only the rule prose, but scope bases, values items and range bounds - has
# its outer whitespace stripped. Nothing else happens to it: the internal
# double spaces below must survive, because collapsing runs is step 2 and step 2
# applies to fingerprints only.
#
# The pair of failures this catches are opposite mistakes. An implementation
# that normalizes only rule.* leaves '  tp8  ' padded and diverges. An
# implementation that applies the fingerprint pipeline to every string
# collapses the prose and diverges the other way.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: outer-whitespace-and-no-reflow
title: Outer whitespace is stripped everywhere; internal whitespace is preserved outside fingerprints
spec: docs/federation.md - canonicalization step 3
tests:
- leading and trailing spaces stripped from rule prose
- leading and trailing tabs stripped
- scope values items are stripped
- scope range bounds are stripped
- scope any basis is stripped
- internal whitespace runs in non-fingerprint strings are NOT collapsed
- case in non-fingerprint strings is NOT folded
