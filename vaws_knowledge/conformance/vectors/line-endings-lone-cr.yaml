# Conformance vector: a lone CR is a line ending too (pinned reading).
#
# federation.md step 3 says "normalize line endings to LF" without enumerating
# them. CRLF is beyond dispute. A lone CR is a line ending in the classic-Mac
# sense, and a Python implementation written with str.splitlines() or a
# regex on [\r\n]+ will normalize it, while one written as
# replace("\r\n", "\n") will not.
#
# So two reasonable implementations disagree here, which is why the case is a
# vector rather than a footnote. The kit pins CR -> LF, the broader reading,
# and records the choice in conformance/README.md. A fork that fails only this
# vector has found a spec question, not a bug in itself.
#
# Synthetic fixture content. Not knowledge. Do not cite.
id: line-endings-lone-cr
title: A lone CR normalizes to LF
spec: docs/federation.md - canonicalization step 3 (pinned reading)
tests:
- a bare CR inside prose becomes LF
- a bare CR mixed with CRLF and LF in one string normalizes uniformly
