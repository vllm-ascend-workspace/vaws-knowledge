# Canonicalization vector: the measurement body variant.
#
id: measurement-body-payload-key
title: A measurement entry hashes scope plus the measurement body
spec: docs/federation.md - Canonicalization, step 1
invariance_group: measurement-body
notes: 'Step 1 takes scope plus the entry''s body, keyed by the body''s own name. The whole point of keying on the
  body name rather than on a fixed ''rule'' is that a rule entry''s payload, and therefore its hash, is untouched
  by the existence of this second variant. The expected payload below begins with "measurement" for the same reason
  the rule vectors'' payloads begin with "rule": sort_keys puts the body first in both cases, and neither collides
  with the other.'
