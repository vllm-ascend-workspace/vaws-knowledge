      superseded_by: null
      resolved_by: null
    rule:
      summary: Distributed init fails because the container does not resolve its own hostname
      symptom: The service crashes or hangs during torch.distributed init with gloo errors naming the
        container hostname, even for single-node tensor parallel above one rank.
      root_cause: Fresh containers do not map their own hostname in /etc/hosts. The gloo store resolves
        the local hostname at init and fails when it does not resolve to an address.
      resolution: Map the container hostname to a loopback address in /etc/hosts before starting the service,
        and enforce it in container bootstrap so every new container is correct on first launch.
      avoidance: Check hostname resolution first. The failing bootstrap log for this observation was at
        /home/example-user/work/vllm-ascend/logs/bootstrap.log.
      fingerprints:
      - gloo makedeviceforhostname
      - name or service not known hostname
      - torch.distributed gloo init failed container
