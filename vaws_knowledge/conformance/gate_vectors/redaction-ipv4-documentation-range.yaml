# SYNTHETIC BAD VALUES - THIS FILE EXISTS TO BE REJECTED.
#
# Every address, hostname, path, e-mail and credential-shaped string in
# conformance/gate_vectors/ is invented for the purpose of being refused by a
# conforming gate. None of it came from a real machine, a real account or a
# real deployment. The addresses are RFC 5737 documentation ranges, the
# hostnames end in .invalid (RFC 2606), and the credentials are the string
# EXAMPLE repeated. A bulk redaction scan of this repository should treat this
# directory as expected-fail fixtures, not as a leak.
#
# An IPv4 address from a documentation range - resolved: this one is allowed.
#
# 192.0.2.13 is inside 192.0.2.0/24, RFC 5737 TEST-NET-1.
#
# This vector was originally written as expected_verdict: reject, pinning the
# literal reading of CONTRIBUTING.md, which banned "IP addresses" without
# qualification. It was marked contested because tools/redact.py exempted the
# documentation ranges, so it was the one vector the real implementation
# failed.
#
# The dispute was decided in the implementation's favour: an address that can
# never route discloses nothing, and fixtures that prove the screening works
# need a rejectable value to feed it. CONTRIBUTING.md now states the exemption
# explicitly and docs/decisions.md records the reasoning. The general point was
# that a rule disagreeing with its own enforcement is worse than either
# alternative, because readers follow the prose and tools follow the code.
#
# So the verdict is flipped and the vector now pins the exemption rather than
# the literal reading. Its complement, redaction-ipv4, uses 198.18.7.42 from
# the RFC 2544 benchmarking range, which is deliberately **not** exempt because
# that space does appear in real internal networks - so the kit still holds a
# rejecting IPv4 vector, and the two together pin exactly where the line sits.
#
id: redaction-ipv4-documentation-range
gate: redaction
expected_verdict: accept
title: An IPv4 address from a documentation range is permitted
spec: CONTRIBUTING.md - Submit only what you are free to publish (one exemption)
permitted:
  class: ipv4
  value: 192.0.2.13
  location: document.entries[0].rule.symptom
  synthetic_source: RFC 5737 TEST-NET-1 documentation range
notes: >-
  Formerly contested and pinned on the literal reading, with 192.0.2.13
  declared as an offending value. Resolved in favour of the exemption, so the
  address is now declared under `permitted` instead: an accept vector must not
  claim a defect, since `offending` means "the thing the gate has to catch".
  See docs/decisions.md for the reasoning, and redaction-ipv4 for the reserved
  range that is still refused.
