  synthetic_source: all-zero machine slot; no inventory numbers from zero
notes: 'Not covered by redaction-internal-hostname: that vector''s value is a dotted name under a reserved TLD,
  and a gate can catch it by looking for a plausible domain suffix. This one has no dot and no domain. It is a machine
  word and a slot number, which is how an internal fleet is actually referred to in prose, and the same document
  carries the second shape in measurement.method.source.ref, where the slot sits inside a run identifier next to
  a device index.

  What must NOT be scrubbed is the rest of that sentence. "NPU 4", "torch_npu 2.5.0.EXAMPLE", "8192x8192 dense matmul"
  and "torch.npu.Event" are what let a reader reproduce the number; a gate that removes the device index to be safe
  destroys the evidence and keeps only the claim. redaction-clean-control holds the same method sentence without
  the machine identity and must still be accepted.'
