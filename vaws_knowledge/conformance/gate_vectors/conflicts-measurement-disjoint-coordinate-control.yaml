# SYNTHETIC BAD VALUES - THIS FILE EXISTS TO BE REJECTED.
#
# Every address, hostname, path, e-mail and credential-shaped string in
# conformance/gate_vectors/ is invented for the purpose of being refused by a
# conforming gate. None of it came from a real machine, a real account or a
# real deployment. The addresses are RFC 5737 documentation ranges, the
# hostnames end in .invalid (RFC 2606), and the credentials are the string
# EXAMPLE repeated. A bulk redaction scan of this repository should treat this
# directory as expected-fail fixtures, not as a leak.
#
# Control case: a difference the coordinate already explains.
#
id: conflicts-measurement-disjoint-coordinate-control
gate: conflicts
expected_verdict: accept
title: Different values at disjoint coordinates are two facts, not a dispute
spec: README.md - Conflict resolution; docs/federation.md - Conflicts
notes: 'Same subject, same quantity identity, different values - and no conflict, because the two entries bound
  `cann` to disjoint value sets. The vendor changed what it declares between two releases, and the coordinate already
  says so. This is the doctrine working rather than a finding, and a gate that reported it would train reviewers
  to dismiss the gate.

  It is the mirror image of conflicts-measurement-contradicting-value: identical claims, and the verdict turns entirely
  on whether the coordinates overlap.'
