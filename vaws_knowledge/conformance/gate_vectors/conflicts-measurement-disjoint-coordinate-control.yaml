    measurement:
      summary: Ascend000 declares a 2.70336 TFLOPS fp16 dense matmul peak in the example platform_config
      subject:
        id: Ascend000
        aliases:
        - 000-EXAMPLE
        family: Ascend000
        architecture: davinci-example
        core_version: AIC-X-000
        compiler_target: dav-x000
      method:
        type: vendor_platform_config
        description: Read out of the platform_config .ini shipped with the example toolkit release. The peak follows
          from the declared cube shape and clock; no operator was executed. Reproduce by parsing the same file from
          any installation of that release.
        parameters:
        - name: cube_shape_m_n_k
          value: 16x16x16
        - name: npu_arch
          value: '0000'
        source:
          kind: vendor_file
          ref: cann-0.0.EXAMPLE:platform_config:Ascend000.ini
          note: Example toolkit release platform_config snapshot.
      quantities:
      - name: fp16_dense_matmul_peak
        basis: theoretical
        value: '2.70336'
        unit: tflops
        qualifier: dense matmul, cube 16x16x16
      - name: ai_core_count
        basis: declared
        value: '1'
        unit: count
      notes:
      - A theoretical peak is the correct MFU denominator and is not what an operator achieves.
