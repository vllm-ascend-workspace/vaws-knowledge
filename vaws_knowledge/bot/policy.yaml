# Review-bot policy. Tracked on purpose: every threshold that changes what the
# bot blocks or proposes is reviewed like code, not tuned in CI variables.
#
# Nothing in this file is knowledge. It configures *how* the bot judges the
# corpus, never *what* is true about Ascend.
policy_version: 1

staleness:
  # docs/lifecycle.md: an entry is downgraded verified -> stale when it has not
  # been re-verified within the policy horizon. 180 days is roughly two
  # vllm-ascend release cycles; a fact nobody re-established across two
  # releases should be labelled, not trusted silently.
  reverification_horizon_days: 180

  # The currently supported version window, compared against
  # verification.verified_against. A dimension with both bounds null is not
  # enforced. The corpus ships empty and this repo does not assert real
  # supported versions on behalf of the projects, so every window is
  # unbounded until maintainers set it in a reviewed PR. Bounds are inclusive
  # and compared with the ordering in bot/versions.py.
  supported_window:
    cann: {min: null, max: null}
    driver: {min: null, max: null}
    torch: {min: null, max: null}
    torch_npu: {min: null, max: null}
    vllm: {min: null, max: null}
    vllm_ascend: {min: null, max: null}

  # verified_against.soc values that are no longer supported. Empty list means
  # no SoC is retired.
  retired_soc: []

  # Statuses the sweep may propose to downgrade. Only verified is downgraded;
  # stale entries are reported as already-stale so a re-verification can be
  # planned, and resolved/deprecated entries are never touched.
  downgrade_from: [verified]

duplicates:
  # Pair score at or above which two entries are reported as near duplicates.
  # Score = 0.7 * rule-body similarity + 0.3 * fingerprint Jaccard (body only
  # when neither side has fingerprints). Advisory: humans merge with
  # lifecycle.supersedes; the bot never merges.
  near_threshold: 0.82
  # Per-field similarity at or above which the field is listed as matched.
  field_match_threshold: 0.9
  # Word-shingle size for body similarity.
  shingle_size: 3

conflicts:
  # Two entries are treated as describing the same phenomenon when their
  # symptom + fingerprints similarity reaches this value, or when they share
  # at least one exact fingerprint.
  same_phenomenon_threshold: 0.45
  # ...and as offering contradictory explanations when the similarity of
  # root_cause + resolution is at or below this value. Both gates must trip
  # for a heuristic conflict; asserted pairs (human or LLM triage) bypass the
  # heuristic but never the coordinate diff.
  divergent_explanation_max: 0.35

measurements:
  # A measurement body carries no diagnosis prose, and the prose it does carry
  # is near-identical across a whole vendor catalogue: sixty-three
  # platform_config rows differ only in a SoC name and some numbers. Scoring
  # them as text would report the catalogue as duplicates of itself. So
  # measurement pairs are compared on subject identity, quantity identity
  # (name + basis) and coordinate instead, and this threshold applies to the
  # quantity-set agreement of two entries that already share a subject and a
  # coordinate.
  near_threshold: 0.5

  # A contradiction is two entries claiming a different value or unit for the
  # same quantity identity, about the same subject, at overlapping
  # coordinates. Unlike a contradictory pair of failure rules - where both
  # sides can still be useful leads and the doctrine is "refine the
  # coordinate, do not arbitrate" - two different numbers for one quantity
  # cannot both be consumed: whoever reads the corpus gets one of them and
  # silently computes with the wrong denominator. So a measurement
  # contradiction blocks on arrival rather than at promotion.
  contradiction_blocks_before_promotion: true

integrity:
  # Handles that must never appear in verification.verified_by. Any handle
  # ending in "[bot]" is rejected regardless of this list.
  bot_handles:
    - vaws-knowledge-bot
    - github-actions
