      cann: 0.0.EXAMPLE
      driver: 0.0.example
      torch: 2.5.1
      torch_npu: 2.5.1.example
      vllm: 0.9.0
      vllm_ascend: 0.0.0+example
      topology: tp8
      execution_mode: eager
    last_verified_at: '2026-05-10'
  lifecycle:
    first_seen: '2026-05-10'
    updated_at: '2026-06-01'
    superseded_by: null
    resolved_by:
      type: pull_request
      ref: example-org/example-repo#77
  rule:
    summary: Example rendezvous times out when one rank registers late
    symptom: Startup hangs and then aborts with an example collective connect timeout.
    root_cause: The example rendezvous bookkeeping dropped a late registration instead
      of retrying it.
    resolution: Upgrade past the fix reference recorded in lifecycle.resolved_by.
    fingerprints:
    - example collective connect timeout

