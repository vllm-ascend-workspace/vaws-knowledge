  rule:
    summary: Example hostname resolution failure during distributed init on SoC A
    symptom: Service exits during distributed init with an example hostname resolution error.
    root_cause: The example container image does not map its own hostname, so the store
      lookup at init has nothing to resolve.
    resolution: Map the container hostname in the image bootstrap before starting the service.
    avoidance: Check hostname resolution before tuning transport environment variables.
    fingerprints:
    - example hostname resolution failed
    - example makedeviceforhostname

