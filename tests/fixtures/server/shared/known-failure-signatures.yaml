# Fixed upstream. docs/lifecycle.md keeps it, with the fix reference.
- uuid: dd44ee55-4444-4ddd-bddd-ff6677889900
  slug: example-shared-collective-connect-timeout
  content_hash: sha256:1484d2889227e2a92e91baffcbbf64b4fc9abe9d8cf3c451031425421bb9dfe3
  status: resolved
  confidence: high
  scope:
    soc:
      any: true
      basis: The defect was in host-side rendezvous bookkeeping, not in device code.
    cann:
      any: true
      basis: Rendezvous happens before collective libraries are loaded.
    driver:
      any: true
      basis: No driver interaction on the failing path.
    python_abi:
      any: true
      basis: The failing path contains no compiled extension.
    torch:
      range:
        min: 2.5.0
        max: null
    torch_npu:
      any: true
      basis: The bug was in plugin-side bookkeeping, not in torch_npu.
    vllm:
      range:
        min: 0.9.0
        max: null
    vllm_ascend:
      range:
        min: 0.0.0
        max: 0.0.1
    model:
      any: true
      basis: Occurs during startup rendezvous, before weights load.
    topology:
      values:
      - tp8
      - tp16
    execution_mode:
      any: true
      basis: Rendezvous precedes both eager execution and graph capture.
    component:
      values:
      - collective-bootstrap
  provenance:
    contributor: example-contributor
    origin_repo: vllm-ascend-workspace/vaws-knowledge
    submitted_at: '2026-05-10'
    redaction_profile: r1
