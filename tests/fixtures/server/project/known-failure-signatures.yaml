  rule:
    summary: Example control-plane transport resets mid-transfer on long syncs
    symptom: Long file syncs abort with an example transport reset.
    root_cause: The example transport idles out mid-transfer because keepalive is unset
      in this repo's client configuration.
    resolution: Set the example keepalive interval in the client configuration.
    fingerprints:
    - example transport reset mid transfer

