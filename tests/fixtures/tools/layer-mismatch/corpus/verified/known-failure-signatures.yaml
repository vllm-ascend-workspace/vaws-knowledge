  rule:
    summary: Distributed init fails because the container does not resolve its own hostname (fixture-layer-directory-mismatch)
    symptom: The service crashes or hangs during torch.distributed init with gloo errors naming the container
      hostname, even for single-node tensor parallel above one rank.
    root_cause: Fresh containers do not map their own hostname in /etc/hosts. The gloo store resolves
      the local hostname at init and fails when it does not resolve to an address.
    resolution: Map the container hostname to a loopback address in /etc/hosts before starting the service,
      and enforce it in container bootstrap so every new container is correct on first launch.
    avoidance: Do not start by tuning gloo or HCCL interface environment variables. Check hostname resolution
      first; in this container family it is the root cause and the environment variables are a distraction.
    fingerprints:
    - gloo makedeviceforhostname
    - name or service not known hostname
    - torch.distributed gloo init failed container
