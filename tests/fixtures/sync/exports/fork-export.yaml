  status: unverified
  confidence: medium
  scope:
    soc:
      any: true
      basis: The failure is in hostname resolution inside the container image, which happens before any
        device is opened; reproduced on two SoC generations.
    cann:
      any: true
      basis: Resolution happens in the gloo store before CANN is initialised, so no CANN code path is
        involved.
    driver:
      any: true
      basis: No driver interaction occurs on this path; the process fails before device open.
    python_abi:
      any: true
      basis: The defect is in container /etc/hosts content, not in any compiled extension.
    torch:
      range:
        max: null
        min: 2.5.0
    torch_npu:
      any: true
      basis: The failing call is torch.distributed gloo hostname resolution, which torch_npu does not
        override.
    vllm:
      range:
        max: null
        min: 0.9.0
    vllm_ascend:
      any: true
      basis: Triggered by the container image, not by plugin code; observed across several plugin revisions.
    model:
      any: true
      basis: Occurs during distributed init, before any weights are read.
    topology:
      values:
      - tp2
      - tp4
      - tp8
      - tp16
    execution_mode:
      any: true
      basis: Failure precedes graph capture and eager execution alike.
    component:
      values:
      - service-bootstrap
