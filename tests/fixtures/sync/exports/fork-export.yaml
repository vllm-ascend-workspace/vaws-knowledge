  rule:
    summary: Graph capture runs out of device memory during warmup at high batch
    symptom: Service exits during the warmup phase with an out-of-memory error from the graph capture
      allocator.
    root_cause: Capture reserves a pool per captured batch size and the default capture list is too wide
      for the memory budget.
    resolution: Narrow the capture sizes to the batch sizes the deployment serves, or lower the memory
      utilisation fraction.
    avoidance: Do not raise the utilisation fraction first; shrink the capture list.
    fingerprints:
    - graph capture out of memory warmup
    - npu out of memory during capture
