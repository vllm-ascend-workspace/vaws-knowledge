  rule:
    summary: Device probe fails when the container user is not in the device group
    symptom: The service reports no devices even though the host lists them; the device nodes are present
      but not readable.
    root_cause: Device nodes are group-owned and the container process runs as a user outside that group.
    resolution: Add the container user to the device group or run with the group id mapped at container
      start.
    avoidance: Check device node permissions before reinstalling the driver.
    fingerprints:
    - no npu device found
    - permission denied device node
