  rule:
    summary: HCCL init times out when the device-side interface is left unset
    symptom: Ranks hang for the full HCCL connect timeout and then abort with a socket timeout naming
      the interface.
    root_cause: The collective library picks the first interface it finds; on multi-homed hosts that is
      not the fabric.
    resolution: Pin the collective interface explicitly in the launch environment before starting any
      rank.
    avoidance: Synthetic fixture text containing the marker QUARANTINE-ME so the tightened redaction stub
      rejects it.
    fingerprints:
    - hccl socket timeout
    - hccl connect timeout interface
