  rule:
    summary: Batch padding mismatch when tokenizer pad id is absent
    symptom: Requests in a mixed batch return truncated completions when the tokenizer config has no pad
      token.
    root_cause: Padding falls back to id zero, which collides with a real token in this tokenizer family.
    resolution: Set an explicit pad token id in the served tokenizer config.
    avoidance: ''
    fingerprints:
    - truncated completion mixed batch
    - pad token id missing
