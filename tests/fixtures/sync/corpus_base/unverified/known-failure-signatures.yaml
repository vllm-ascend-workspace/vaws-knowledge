      basis: The failure is in hostname resolution inside the container image, which happens before any
        device is opened; reproduced on two SoC generations.
    cann:
      any: true
      basis: Resolution happens in the gloo store before CANN is initialised, so no CANN code path is
        involved.
    driver:
      any: true
      basis: No driver interaction occurs on this path; the process fails before device open.
    python_abi:
      any: true
      basis: The defect is in container /etc/hosts content, not in any compiled extension.
    torch:
      range:
        max: null
        min: 2.5.0
    torch_npu:
      any: true
      basis: The failing call is torch.distributed gloo hostname resolution, which torch_npu does not
        override.
    vllm:
