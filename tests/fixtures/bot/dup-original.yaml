  rule:
    summary: Tensor-parallel rendezvous times out because the loopback route is missing
    symptom: Multi-rank service start hangs at the torch.distributed rendezvous and times out
      with a connection refused error naming the local rank address.
    root_cause: The container network namespace has no loopback route, so the rendezvous
      store connect to the local rank address is refused before HCCL is initialised.
    resolution: Add the loopback route in the container bootstrap before launching the
      service so every rank can reach the rendezvous store.
    fingerprints:
    - rendezvous connection refused
    - torch.distributed timeout local rank
