# Opt-in template for a fork or local consumer that wants to pull the
# published verified snapshot. Copy this file yourself; this repository
# never writes it into other repositories, never installs a local
# scheduler, and never claims it has run on all forks.
#
# GitHub schedules in new public forks are disabled by default. Central
# collection of *upward* candidates does not require enabling this file.
#
# This template only prints import instructions. It does not download a
# snapshot or refresh a local shared cache. A central workflow cannot
# populate another developer's untracked `.vaws-local/knowledge/shared/`.
# Use the accepted Phase B importer against an exact verified directory:
# python3 .agents/scripts/knowledge_shared_cache.py import --from <verified>
#   --source-repo <declared-repo> --source-ref <exact-40-character-commit>
# Last-valid-cache is preserved on a failed refresh; unverified/project
# documents cannot enter shared.

name: Pull verified knowledge snapshot
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '12 6 * * 1'

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Print the Phase B import recipe (no refresh)
        run: |
          echo "This template does not refresh a cache."
          echo "python3 .agents/scripts/knowledge_shared_cache.py import --from <verified-directory> --source-repo <declared-repo> --source-ref <exact-40-character-commit>"
          echo "Source must be snapshot/verified or corpus/verified at that exact commit."
          echo "Do not import corpus/unverified or project-layer documents as shared."
          echo "On a failed refresh, keep the last valid local shared cache."
          echo "This job cannot write another machine's .vaws-local/knowledge/shared/."
