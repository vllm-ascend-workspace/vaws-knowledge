name: Verified snapshot

# Periodic verified-only snapshot of the trusted current default-branch
# corpus. Schema/integrity and redaction gates run first. Never publishes
# corpus/unverified/. An empty verified corpus is an accurately labelled
# empty snapshot, not runtime or acceptance evidence.
#
# Cadence: 05:33 UTC daily, offset from central collection. A snapshot is
# cheap when verified/ is empty and keeps the published digest bound to
# HEAD. This workflow cannot populate another developer's untracked
# `.vaws-local/knowledge/shared/` cache.

on:
  schedule:
    - cron: '33 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install trusted dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f sync/requirements.txt ]; then pip install -r sync/requirements.txt; fi

      - name: Gate and publish the verified snapshot
        run: |
          set -euo pipefail
          python3 sync/snapshot.py --out verified-snapshot --revision "${{ github.sha }}"
          test -s verified-snapshot/manifest.json
          python3 - <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path("verified-snapshot/manifest.json").read_text())
          if manifest.get("layer") != "verified":
              sys.exit("snapshot layer is not verified")
          if (pathlib.Path("verified-snapshot") / "unverified").exists():
              sys.exit("refusing unverified snapshot files")
          print("entry_count", manifest.get("entry_count"))
          print("snapshot_digest", manifest.get("snapshot_digest"))
          print("corpus_revision", manifest.get("corpus_revision"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: verified-snapshot
          path: verified-snapshot
