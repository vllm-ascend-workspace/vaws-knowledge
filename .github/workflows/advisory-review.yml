name: Advisory review

# Trusted default-branch listener for incoming knowledge PR data.
# Distinct from "Review gates" and "Review comment". workflow_run always
# executes this file from the default branch. The secret-bearing job never
# checks out pull-request code, never installs pull-request dependencies,
# and never treats the untrusted gate artifact as authority. It fetches
# selected corpus YAML at the immutable source head and re-runs trusted
# gates through bot/triage_grok.py before any provider egress.
# Missing XAI_API_KEY / XAI_MODEL is a visible unavailable advisory with
# zero provider calls, not an empty successful semantic review.

on:
  workflow_run:
    workflows: ["Review gates"]
    types: [completed]

permissions:
  contents: read

jobs:
  advisory:
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the trusted checkout package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch immutable head corpus and run advisory adapter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          stash="${RUNNER_TEMP}/vaws-advisory"
          mkdir -p "$stash" advisory-report
          python3 -m vaws_knowledge.bot.advisory_review \
            --stash "$stash" \
            --json advisory-report/advisory.json
          test -s advisory-report/advisory.json

      - uses: actions/upload-artifact@v4
        with:
          name: advisory-review
          path: advisory-report

  comment:
    needs: advisory
    if: needs.advisory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the trusted checkout package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: advisory-review
          path: advisory-report

      - name: Publish the bound advisory comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 -m vaws_knowledge.bot.advisory_review --publish-comment --artifact-dir advisory-report
