name: Central collection

# Trusted default-branch collection of already-public knowledge YAML from the
# scaffold parent (numeric id 1196723340) and its accessible public forks.
# Candidate PRs are opened only in this repository. Forks are never written.
#
# Cadence: 04:27 UTC daily. Collection is source-driven (new public YAML), not
# a months-long staleness horizon, so a daily off-hour run surfaces eligible
# v2 entries within a day without an hourly API burn. The minute is offset
# from the weekly corpus audit. workflow_dispatch preview never writes;
# scheduled runs may propose after gates. Root may still need to grant the
# built-in token creation permission; this file requests job-level writes
# only on the propose job.

on:
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: preview never writes; propose opens candidate PRs after gates
        type: choice
        required: true
        default: preview
        options:
          - preview
          - propose

concurrency:
  group: knowledge-central-collection-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VAWS_COLLECT_MAX_PAGES: '5'
      VAWS_COLLECT_MAX_FORKS: '100'
      VAWS_COLLECT_MAX_FILES_PER_REPO: '32'
      VAWS_COLLECT_MAX_FILE_BYTES: '262144'
      VAWS_COLLECT_MAX_TOTAL_BYTES: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install trusted dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f sync/requirements.txt ]; then pip install -r sync/requirements.txt; fi

      - name: Discover, fetch and gate (read-only preview)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stash="${RUNNER_TEMP}/vaws-collect"
          mkdir -p "$stash"
          mkdir -p collect-handoff
          python3 sync/collect.py \
            --mode preview \
            --parent-id 1196723340 \
            --stash "$stash" \
            --json collect-handoff/result.json \
            --handoff-dir collect-handoff \
            --max-pages "${VAWS_COLLECT_MAX_PAGES}" \
            --max-forks "${VAWS_COLLECT_MAX_FORKS}" \
            --max-files-per-repo "${VAWS_COLLECT_MAX_FILES_PER_REPO}" \
            --max-file-bytes "${VAWS_COLLECT_MAX_FILE_BYTES}" \
            --max-total-bytes "${VAWS_COLLECT_MAX_TOTAL_BYTES}"
          test -s collect-handoff/result.json

      - uses: actions/upload-artifact@v4
        with:
          name: collect-handoff
          path: collect-handoff

  propose:
    needs: collect
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'propose')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install trusted dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f sync/requirements.txt ]; then pip install -r sync/requirements.txt; fi

      - uses: actions/download-artifact@v4
        with:
          name: collect-handoff
          path: collect-handoff

      - name: Propose gated candidate PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stash="${RUNNER_TEMP}/vaws-collect-propose"
          mkdir -p "$stash" collect-handoff/exports
          python3 sync/collect.py \
            --mode propose \
            --from-exports collect-handoff/exports \
            --stash "$stash" \
            --json propose-result.json
          test -s propose-result.json
          echo "Candidate PR CI from the built-in token awaits any GitHub-required approval; this job does not claim CI executed or passed."

      - uses: actions/upload-artifact@v4
        with:
          name: collect-proposal
          path: propose-result.json

  advisory:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install trusted dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f bot/requirements.txt ]; then pip install -r bot/requirements.txt; fi

      - uses: actions/download-artifact@v4
        with:
          name: collect-handoff
          path: collect-handoff

      - name: Advisory triage of gated exports
        run: |
          set -euo pipefail
          mkdir -p collect-handoff/exports
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(find collect-handoff/exports -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            printf '%s\n' '{"advisory":true,"status":"unavailable","reason":"no eligible input","provider":{"called":false},"notes":["Unavailable is not a successful semantic review."]}' > collect-advisory.json
          else
            python3 bot/triage_grok.py \
              --source-repo "${{ github.repository }}" \
              --source-ref "${{ github.sha }}" \
              --json collect-advisory.json \
              "${files[@]}"
          fi
          test -s collect-advisory.json

      - uses: actions/upload-artifact@v4
        with:
          name: collect-advisory
          path: collect-advisory.json
